name: Deploy to GitHub Pages

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Публикуем только сам сайт: исходники сборки и README остаются в
      # репозитории, но на домен не выкладываются.
      - name: Собрать артефакт из файлов сайта
        run: |
          mkdir -p _site
          cp -R index.html 404.html .nojekyll assets _site/
          echo "Файлы к публикации:" && find _site -type f | wc -l

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
